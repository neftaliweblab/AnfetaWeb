<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080B0F"><title>ANFETA · Sin conexión</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#080b0f;color:#e2e8f0;font:16px system-ui}main{margin:24px;padding:32px;max-width:420px;border:1px solid #164e63;border-radius:18px;background:#0f172a}h1{font-size:24px;color:#67e8f9}p{line-height:1.6;color:#94a3b8}button{padding:12px 20px;border:0;border-radius:8px;background:#0369a1;color:white;font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #67e8f9;outline-offset:4px}</style><main><strong>ANFETA</strong><h1>Sin conexión</h1><p>No pudimos conectar con el servidor. Revisa tu conexión y vuelve a intentarlo.</p><p>Los datos y cambios requieren conexión. Esta pantalla no confirma envíos ni guardados pendientes.</p><button type="button" id="retry">Volver a intentar</button><p role="status" id="status"></p></main><script>document.getElementById('retry').addEventListener('click',()=>location.reload());window.addEventListener('online',()=>{document.getElementById('status').textContent='Conexión recuperada. Abriendo ANFETA…';location.reload();});</script></html>
